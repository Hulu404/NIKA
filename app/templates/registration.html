<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Manrope&display=swap" rel="stylesheet" />
    <title>NIKA - Регистрация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            min-height: 100vh;
            background:
                linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                url('../../static/images/background_main.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Стеклянный эффект для всей страницы */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(102, 126, 234, 0.1);
            backdrop-filter: blur(10px);
            z-index: 0;
        }

        .registration_page {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }

        /* Стеклянная регистрационная форма */
        .registration_window {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            padding: 40px 35px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Световые эффекты */
        .registration_window::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            z-index: 0;
        }

        /* Заголовок */
        .registration_header {
            font-size: 32px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            display: block;
            position: relative;
            z-index: 1;
            letter-spacing: 1px;
        }

        /* Форма */
        .registration_form {
            position: relative;
            z-index: 1;
            margin-bottom: 25px;
        }

        /* Поля ввода */
        .registration_input {
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 18px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: white;
            font-size: 16px;
            font-family: 'Manrope', sans-serif;
            transition: all 0.3s ease;
            outline: none;
            backdrop-filter: blur(5px);
        }

        .registration_input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .registration_input:focus {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(102, 126, 234, 0.8);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .registration_input:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .registration_input_sport {
            margin-bottom: 0;
        }

        /* Контейнер для пола и вида спорта */
        .registration_form_wrapper {
            display: flex;
            gap: 15px;
            margin-bottom: 18px;
            align-items: center;
        }

        /* Переработанные кнопки выбора пола */
        .gender-selector {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        .gender-option {
            flex: 1;
            position: relative;
        }

        .gender-option input[type="radio"] {
            display: none;
        }

        .gender-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
            min-width: 60px;
        }

        .gender-label::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gender-label span {
            position: relative;
            z-index: 1;
        }

        .gender-option input[type="radio"]:checked + .gender-label {
            background: rgba(102, 126, 234, 0.25);
            border-color: rgba(102, 126, 234, 0.8);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .gender-option input[type="radio"]:checked + .gender-label::before {
            opacity: 1;
        }

        .gender-label:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Кнопка отправки */
        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
            z-index: 1;
            font-family: 'Manrope', sans-serif;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        /* Ссылки */
        .login_link, .registration_faq_link {
            display: inline-block;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 16px;
            margin: 10px 15px;
            padding: 10px 20px;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
        }

        .login_link:hover, .registration_faq_link:hover {
            color: white;
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        /* Сообщения об ошибках */
        .error-message {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 14px;
            backdrop-filter: blur(5px);
            display: none;
            text-align: left;
        }

        .success-message {
            color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 14px;
            backdrop-filter: blur(5px);
            display: none;
        }

        /* Лоадер */
        .loader {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Преимущества регистрации */
        .benefits {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
        }

        .benefits h3 {
            color: white;
            margin-bottom: 15px;
            font-size: 18px;
            text-align: center;
        }

        .benefits-list {
            list-style: none;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            line-height: 1.6;
        }

        .benefits-list li {
            padding: 5px 0;
            position: relative;
            padding-left: 25px;
        }

        .benefits-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #4CAF50;
            font-weight: bold;
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            .registration_window {
                padding: 30px 20px;
            }

            .registration_header {
                font-size: 28px;
            }

            .registration_input {
                padding: 14px 16px;
                font-size: 15px;
            }

            .registration_form_wrapper {
                flex-direction: column;
                gap: 12px;
            }

            .gender-selector {
                width: 100%;
            }

            .submit-btn {
                padding: 16px;
                font-size: 16px;
            }

            .login_link, .registration_faq_link {
                display: block;
                margin: 10px 0;
            }
        }

        @media (max-width: 400px) {
            .registration_window {
                padding: 25px 15px;
            }

            .registration_header {
                font-size: 24px;
            }
        }

        /* Анимации */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .registration_window {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
</head>
<body>
    <div class="registration_page">
        <div class="registration_window">
            <span class="registration_header">Регистрация в NIKA</span>

            <!-- Сообщение об ошибке -->
            <div class="error-message" id="error-message"></div>

            <!-- Сообщение об успехе -->
            <div class="success-message" id="success-message"></div>

            <form class="registration_form" id="registration_form">
                <input class="registration_input" name="name" placeholder="Имя" type="text" required>
                <input class="registration_input" name="surname" placeholder="Фамилия" type="text" required>
                <input class="registration_input" name="email" placeholder="Email" type="email" required>
                <input class="registration_input" name="password" placeholder="Пароль" type="password" required>

                <div class="registration_form_wrapper">
                    <div class="gender-selector">
                        <div class="gender-option">
                            <input type="radio" name="gender" value="female" id="female-radio">
                            <label class="gender-label" for="female-radio">
                                <span>Женский</span>
                            </label>
                        </div>
                        <div class="gender-option">
                            <input type="radio" name="gender" value="male" id="male-radio">
                            <label class="gender-label" for="male-radio">
                                <span>Мужской</span>
                            </label>
                        </div>
                    </div>

                    <input class="registration_input registration_input_sport" name="sport_type" placeholder="Вид спорта (необязательно)">
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">
                    Создать аккаунт
                </button>
            </form>

            <!-- Преимущества регистрации -->
            <div class="benefits">
                <h3>Преимущества регистрации:</h3>
                <ul class="benefits-list">
                    <li>10+ запросов в день вместо 5</li>
                    <li>Голосовые ответы от Nika</li>
                    <li>История всех диалогов</li>
                    <li>Персональные рекомендации</li>
                    <li>Дополнительные функции</li>
                </ul>
            </div>

            <a class="login_link" href="/login">Уже есть аккаунт? Войти</a>
            <a class="registration_faq_link" href="">Частые вопросы</a>
        </div>

        <!-- Лоадер -->
        <div class="loader" id="loader">
            <div class="loader-spinner"></div>
            <div>Создаем ваш аккаунт...</div>
        </div>
    </div>

    <script>
        // DOM элементы
        const form = document.getElementById('registration_form');
        const submitBtn = document.getElementById('submit-btn');
        const loader = document.getElementById('loader');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');
        const femaleRadio = document.getElementById('female-radio');
        const maleRadio = document.getElementById('male-radio');

        // Обработка выбора пола
        femaleRadio.addEventListener('change', () => {
            if (femaleRadio.checked) {
                console.log('Выбран женский пол');
            }
        });

        maleRadio.addEventListener('change', () => {
            if (maleRadio.checked) {
                console.log('Выбран мужской пол');
            }
        });

        // Валидация email
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        // Валидация пароля
        function validatePassword(password) {
            return password.length >= 6;
        }

        // Показать ошибку
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';

            // Автоматическое скрытие через 5 секунд
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        // Показать успех
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        // Обработчик отправки формы
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Сбор данных формы
            const formData = new FormData(form);
            const data = {
                name: formData.get('name'),
                surname: formData.get('surname'),
                email: formData.get('email'),
                password: formData.get('password'),
                gender: femaleRadio.checked ? 'female' : maleRadio.checked ? 'male' : null,
                sport_type: formData.get('sport_type')
            };

            // Валидация
            if (!data.name || !data.surname) {
                showError('Пожалуйста, введите имя и фамилию');
                return;
            }

            if (!data.email || !validateEmail(data.email)) {
                showError('Пожалуйста, введите корректный email');
                return;
            }

            if (!data.password || !validatePassword(data.password)) {
                showError('Пароль должен содержать минимум 6 символов');
                return;
            }

            // Показываем лоадер
            submitBtn.disabled = true;
            loader.style.display = 'flex';

            try {
                // Отправка данных на сервер
                const response = await fetch('/registration', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                // Скрываем лоадер
                loader.style.display = 'none';
                submitBtn.disabled = false;

                if (response.ok && result.success) {
                    // Успешная регистрация
                    showSuccess('Регистрация успешна! Перенаправляем...');

                    // Перенаправление через 2 секунды
                    setTimeout(() => {
                        window.location.href = '/chat';
                    }, 2000);
                } else {
                    // Ошибка регистрации
                    showError(result.message || 'Ошибка регистрации. Попробуйте снова.');
                }
            } catch (error) {
                // Скрываем лоадер
                loader.style.display = 'none';
                submitBtn.disabled = false;

                console.error('Ошибка:', error);
                showError('Ошибка сети. Проверьте подключение к интернету.');
            }
        });

        // Плавное появление формы
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.registration_input');
            inputs.forEach((input, index) => {
                input.style.animationDelay = `${index * 0.1}s`;
                input.style.animation = 'fadeInUp 0.5s ease-out forwards';
                input.style.opacity = '0';
            });

            // Автоматическое скрытие сообщений при клике
            errorMessage.addEventListener('click', () => {
                errorMessage.style.display = 'none';
            });

            successMessage.addEventListener('click', () => {
                successMessage.style.display = 'none';
            });

            // Фокус на первом поле
            document.querySelector('.registration_input[name="name"]').focus();
        });

        // Добавление анимации при наведении на ссылки
        const links = document.querySelectorAll('.login_link, .registration_faq_link');
        links.forEach(link => {
            link.addEventListener('mouseenter', () => {
                link.style.transform = 'translateY(-3px) scale(1.05)';
            });

            link.addEventListener('mouseleave', () => {
                link.style.transform = 'translateY(0) scale(1)';
            });
        });
    </script>
</body>
</html>
