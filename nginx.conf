
user  root;
#Defines which Linux system user will own and run the Nginx server

worker_processes  1;
#Referes to single threaded process. Generally set to be equal to the number of CPUs or cores.

events {
    worker_connections 1024;
}

http {
    # Первый сервер: слушает HTTP, обслуживает запросы Certbot и перенаправляет остальное на HTTPS
    server {
        listen 80;
        server_name nikamentalhelth.ru www.nikamentalhelth.ru;

        # Для проверки домена Certbot'ом
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Всё остальное перенаправляем на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Второй сервер: слушает HTTPS
    server {
        listen 443 ssl http2;
        server_name nikamentalhelth.ru www.nikamentalhelth.ru;

        # Пути к сертификатам (они будут смонтированы из тома certbot-conf)
        ssl_certificate /etc/letsencrypt/live/nikamentalhelth.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nikamentalhelth.ru/privkey.pem;

        # Современные настройки SSL (рекомендуется)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Прокси на фронтенд
        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Прокси на API
        location /api/ {
            proxy_pass http://backend:5001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}