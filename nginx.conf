user root;
worker_processes  1;
events {
    worker_connections 1024;
}
http {
    resolver 127.0.0.11 valid=10s;  # DNS Docker'а
    server {
        listen 80;
        server_name nikamentalhelth.ru www.nikamentalhelth.ru;

        location /.well-known/acme-challenge/ {
            alias /var/www/certbot/.well-known/acme-challenge/;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Второй сервер: слушает HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name nikamentalhelth.ru www.nikamentalhelth.ru;

        # Пути к сертификатам (они будут смонтированы из тома certbot-conf)
        ssl_certificate /etc/letsencrypt/live/nikamentalhelth.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nikamentalhelth.ru/privkey.pem;

        # Современные настройки SSL (рекомендуется)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
	
	# Прокси на Rest-API документацию
	location /flasgger_static/ {
	    set $backend_upstream http://backend:5001;
	    proxy_pass $backend_upstream;
	    proxy_set_header Host $host;
	    proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	}

        # Прокси на фронтенд
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Прокси на API
        location /api/ {
            set $backend_upstream http://backend:5001;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
