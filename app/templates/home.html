<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Психолог-помощник спортсмена</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: system-ui, Arial;
      background: #f5f7fb;
      color: #111;
    }

    /* ===== Header ===== */
    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .left, .right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-weight: 600;
      font-size: 18px;
      margin-right: 30px;
    }

    nav a {
      text-decoration: none;
      color: #111;
      font-size: 15px;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background .2s;
    }

    nav a:hover {
      background: #eef2f7;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: opacity .2s;
    }

    .btn-primary {
      background: #4a90e2;
      color: white;
    }

    .btn-secondary {
      background: #eef2f7;
      color: #111;
    }

    .btn:hover {
      opacity: .9;
    }

    /* ===== Main ===== */
    main {
      max-width: 900px;
      margin: 60px auto;
      padding: 0 20px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 16px;
    }

    p {
      font-size: 18px;
      color: #555;
      max-width: 600px;
      margin: 0 auto;
    }
  </style>
</head>

<body>

<header>
  <div class="left">
    <div class="logo">Психолог-помощник</div>

    <nav>
      <a href="#about">О нас</a>
      <a href="/chat">Чат</a>
    </nav>
  </div>

  <div class="right">
    <button class="btn btn-secondary">Регистрация</button>
    <button class="btn btn-primary">Авторизация</button>
  </div>
</header>

<main>
  <h1>Ментальная поддержка для спортсменов-любителей</h1>
  <p>
    Помогаем справляться со стрессом, волнением и выгоранием
    с помощью умного ИИ-ассистента и практических психологических техник.
  </p>
</main>

</body>
</html>
