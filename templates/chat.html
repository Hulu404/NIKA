<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Чат</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #e5ddd5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-window {
            width: 380px;
            height: 600px;
            background: #fff;
            display: flex;
            flex-direction: column;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .chat-header {
            background: #075e54;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            background: #ece5dd;
        }

        .message {
            max-width: 70%;
            padding: 8px 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            word-wrap: break-word;
        }

        .message.user {
            background: #dcf8c6;
            margin-left: auto;
            border-bottom-right-radius: 0;
        }

        .message.server {
            background: #fff;
            margin-right: auto;
            border-bottom-left-radius: 0;
        }

        .chat-input {
            display: flex;
            padding: 10px;
            background: #f0f0f0;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: none;
            outline: none;
        }

        .chat-input button {
            margin-left: 8px;
            padding: 10px 15px;
            border: none;
            border-radius: 50%;
            background: #075e54;
            color: white;
            cursor: pointer;
        }

        .chat-input button:hover {
            background: #064c45;
        }
    </style>
</head>
<body>

<div class="chat-window">
    <div class="chat-header">Чат с сайтом</div>

    <div id="messages" class="chat-messages"></div>

    <div class="chat-input">
        <input type="text" id="messageInput" placeholder="Введите сообщение">
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
function addMessage(text, sender) {
    const messages = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "message " + sender;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function sendMessage() {
    const input = document.getElementById("messageInput");
    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    // 🔌 Flask endpoint
    fetch("/send_message", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: text})
    })
    .then(res => res.json())
    .then(data => {
        addMessage(data.reply, "server");
    });
}

// Отправка по Enter
document.getElementById("messageInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
