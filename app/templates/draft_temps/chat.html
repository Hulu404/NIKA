<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Чат</title>
<style>
body { font-family: Arial; background:#f1f1f1; }
.chat {
  width:400px; margin:40px auto;
  background:white; border-radius:12px;
  display:flex; flex-direction:column; height:520px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}
.messages {
  flex:1; overflow-y:auto; padding:15px;
}
.msg { padding:10px 12px; border-radius:14px; margin-bottom:10px; max-width:80%; }
.me { background:#d1e7ff; margin-left:auto; }
.bot { background:#eee; margin-right:auto; }
.input-area {
  display:flex; padding:12px; border-top:1px solid #ddd;
}
input { flex:1; padding:10px; border-radius:20px; border:1px solid #ccc; }
button { margin-left:10px; border:none; border-radius:20px; padding:0 18px; cursor:pointer; }
</style>
</head>
<body>
<div class="chat">
  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input id="msg" placeholder="Напишите сообщение...">
    <button onclick="send()">Отправить</button>
  </div>
</div>

<script>
const box = document.getElementById("messages");

function addMsg(text, cls){
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

async function send(){
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if(!text) return;

  addMsg(text, "me");
  input.value = "";

  const res = await fetch("/api/chat", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ message:text })
  });

  const data = await res.json();
  addMsg(data.reply, "bot");
}
</script>
</body>
</html>
