<!DOCTYPE html>
<html>
    <head>
        <link href="https://fonts.googleapis.com/css?family=Manrope&display=swap" rel="stylesheet" />
        <link href="../../static/css/login.css" rel="stylesheet" />
        <title>NIKA - Вход</title>
    </head>
    <body>
        <div class="login_page">
            <div class="login_window">
                <span class="login_header">Войти</span>
                <form class="login_form" id="login_form" >
                    <input class="login_email_input" name="email" placeholder="Email" type="email"></input>
                    <input class="login_password_input" name="password" placeholder="Пароль" type="password"></input>
                    <input type="submit" hidden>
                </form>
                <a class="login_faq_link" href="#">FAQs</a>
            </div>
        </div>
    </body>
    <script src="../../static/js/login.js" defer></script>
</html>
