<!DOCTYPE html>
<html>
    <head>
        <link href="https://fonts.googleapis.com/css?family=Manrope&display=swap" rel="stylesheet" />
        <link href="../../static/css/login.css" rel="stylesheet" />
        <title>NIKA - Вход</title>
        <style>
            /* Стили для кнопки */
            .login_form button[type="submit"] {
                width: 100%;
                padding: 14px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                border-radius: 8px;
                font-family: 'Manrope', sans-serif;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                margin-top: 20px;
                transition: all 0.3s ease;
            }

            .login_form button[type="submit"]:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            }

            .login_form button[type="submit"]:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
                box-shadow: none;
            }

            /* Дополнительные ссылки */
            .login-links {
                text-align: center;
                margin-top: 20px;
            }

            .login-links a {
                display: block;
                color: #667eea;
                text-decoration: none;
                font-size: 14px;
                margin-bottom: 10px;
            }

            .login-links a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="login_page">
            <div class="login_window">
                <span class="login_header">Войти</span>
                <form class="login_form" id="login_form" method="POST">
                    <input class="login_email_input" name="email" placeholder="Email" type="email" required>
                    <input class="login_password_input" name="password" placeholder="Пароль" type="password" required>
                    <button type="submit" id="submit-btn">Войти</button>
                </form>

                <div class="login-links">
                    <a href="{{ url_for('main.registration') }}">Нет аккаунта? Зарегистрироваться</a>
                    <a href="{{ url_for('main.index') }}">← Вернуться на главную</a>
                </div>
            </div>
        </div>
    </body>
    <script src="../../static/js/login.js"></script>
</html>
