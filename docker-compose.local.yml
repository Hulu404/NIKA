networks:
  dev:

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - './nginx.local.conf:/etc/nginx/nginx.conf'
      - './empty.conf:/etc/nginx/conf.d/default.conf'
    depends_on:
      - backend
      - frontend
    networks:
      - dev
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
    volumes:
      - ./backend_db:/instance
    networks:
      - dev

  frontend:
    build:
      context: ./frontend
    networks:
      - dev
