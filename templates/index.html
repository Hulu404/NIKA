<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Психолог-помощник</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: system-ui, Arial;
      background: #f5f7fb;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== Header ===== */
    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-link {
      text-decoration: none;
      font-size: 14px;
      color: #4a90e2;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background .2s;
    }

    .back-link:hover {
      background: #eef2f7;
    }

    .title {
      font-size: 18px;
      font-weight: 600;
    }

    .icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #e7e9ee;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* ===== Chat Area ===== */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.3;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn .25s forwards ease-out;
    }

    .user {
      align-self: flex-end;
      background: #4a90e2;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot {
      align-self: flex-start;
      background: white;
      border: 1px solid #e4e6eb;
      border-bottom-left-radius: 4px;
      position: relative; /* Для позиционирования кнопки аудио */
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== Стили для кнопки аудио ===== */
    .audio-controls {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .audio-btn {
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .2s;
    }

    .audio-btn:hover {
      background: #3a80d2;
    }

    .audio-btn.playing {
      background: #2ecc71;
    }

    .audio-btn.error {
      background: #e74c3c;
    }

    .audio-progress {
      flex: 1;
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      overflow: hidden;
    }

    .audio-progress-bar {
      height: 100%;
      background: #4a90e2;
      width: 0%;
      transition: width 0.1s;
    }

    /* ===== Input Bar ===== */
    .input-bar {
      display: flex;
      gap: 10px;
      padding: 14px;
      background: white;
      border-top: 1px solid #e5e7eb;
      flex-shrink: 0;
    }

    textarea {
      flex: 1;
      resize: none;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      padding: 10px;
      font-size: 15px;
      outline: none;
    }

    button {
      padding: 0 16px;
      border-radius: 10px;
      border: none;
      background: #4a90e2;
      color: white;
      cursor: pointer;
    }

    button:active {
      opacity: .9;
    }

    /* ===== Переключатель режима ===== */
    .mode-switch {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 20px;
      font-size: 14px;
      color: #555;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #4a90e2;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }
  </style>
</head>

<body>

<header>
  <div class="header-left">
    <a href="/" class="back-link">← На главную</a>
    <div class="title">Психолог-помощник спортсмена</div>
  </div>

  <div class="mode-switch">
    <span>Текст</span>
    <label class="switch">
      <input type="checkbox" id="audioToggle">
      <span class="slider"></span>
    </label>
    <span>Аудио</span>
  </div>

  <div class="icon">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="8" r="4" stroke="#555" stroke-width="2"/>
      <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="#555" stroke-width="2"/>
    </svg>
  </div>
</header>

<div class="chat" id="chat"></div>

<div class="input-bar">
  <textarea id="msg" placeholder="Напишите сообщение..." rows="1"></textarea>
  <button onclick="sendMessage()">Отправить</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('msg');
  const audioToggle = document.getElementById('audioToggle');
  
  // Хранилище для аудио объектов
  const audioPlayers = new Map(); // audioId -> {audio, button, progress}

  function addBubble(text, type = "user", audioData = null) {
    const bubble = document.createElement('div');
    bubble.className = `bubble ${type}`;
    bubble.textContent = text;
    
    // Для сообщений бота добавляем кнопку аудио если есть данные
    if (type === "bot" && audioData && audioToggle.checked) {
      const audioId = 'audio_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      
      const controlsDiv = document.createElement('div');
      controlsDiv.className = 'audio-controls';
      
      // Кнопка воспроизведения
      const playBtn = document.createElement('button');
      playBtn.className = 'audio-btn';
      playBtn.innerHTML = '🔊';
      playBtn.title = 'Воспроизвести ответ';
      
      // Прогресс-бар
      const progressDiv = document.createElement('div');
      progressDiv.className = 'audio-progress';
      const progressBar = document.createElement('div');
      progressBar.className = 'audio-progress-bar';
      progressDiv.appendChild(progressBar);
      
      controlsDiv.appendChild(playBtn);
      controlsDiv.appendChild(progressDiv);
      bubble.appendChild(controlsDiv);
      
      // Создаем аудио объект
      let audio;
      if (audioData.base64) {
        // Используем base64 аудио
        audio = new Audio('data:audio/mp3;base64,' + audioData.base64);
      } else if (audioData.url) {
        // Используем URL к файлу
        audio = new Audio(audioData.url);
      }
      
      if (audio) {
        audio.preload = 'auto';
        
        // Сохраняем в хранилище
        audioPlayers.set(audioId, {
          audio: audio,
          button: playBtn,
          progress: progressBar,
          isPlaying: false
        });
        
        // Обработчик клика по кнопке
        playBtn.onclick = () => toggleAudio(audioId);
        
        // Обновление прогресса
        audio.addEventListener('timeupdate', () => {
          const percent = (audio.currentTime / audio.duration) * 100;
          progressBar.style.width = percent + '%';
        });
        
        // Когда аудио закончилось
        audio.addEventListener('ended', () => {
          const player = audioPlayers.get(audioId);
          if (player) {
            player.button.classList.remove('playing');
            player.button.innerHTML = '🔊';
            player.isPlaying = false;
            player.progress.style.width = '0%';
          }
        });
        
        // Ошибка загрузки
        audio.addEventListener('error', () => {
          playBtn.classList.add('error');
          playBtn.innerHTML = '❌';
          playBtn.title = 'Ошибка загрузки аудио';
        });
      }
    }
    
    chat.appendChild(bubble);
    chat.scrollTop = chat.scrollHeight;
    return bubble;
  }

  function toggleAudio(audioId) {
    const player = audioPlayers.get(audioId);
    if (!player) return;
    
    if (player.isPlaying) {
      // Останавливаем
      player.audio.pause();
      player.audio.currentTime = 0;
      player.button.classList.remove('playing');
      player.button.innerHTML = '🔊';
      player.isPlaying = false;
      player.progress.style.width = '0%';
    } else {
      // Останавливаем все другие аудио
      audioPlayers.forEach((p, id) => {
        if (id !== audioId && p.isPlaying) {
          p.audio.pause();
          p.audio.currentTime = 0;
          p.button.classList.remove('playing');
          p.button.innerHTML = '🔊';
          p.isPlaying = false;
          p.progress.style.width = '0%';
        }
      });
      
      // Запускаем выбранное
      player.audio.play().then(() => {
        player.button.classList.add('playing');
        player.button.innerHTML = '⏸️';
        player.isPlaying = true;
      }).catch(error => {
        console.error('Ошибка воспроизведения:', error);
        player.button.classList.add('error');
        player.button.innerHTML = '❌';
      });
    }
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    addBubble(text, "user");

    try {
      // Определяем endpoint в зависимости от режима
      const endpoint = audioToggle.checked 
        ? "/api/message-with-audio" 
        : "/api/message";
      
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });

      const data = await res.json();
      
      if (audioToggle.checked) {
        // Режим с аудио
        if (data.success) {
          addBubble(data.text || data.reply || "Ответ получен", "bot", data.audio);
        } else {
          addBubble(data.error || "Ошибка получения аудио", "bot");
        }
      } else {
        // Текстовый режим
        addBubble(data.reply || "Ответ получен", "bot");
      }

    } catch (e) {
      console.error(e);
      addBubble("Ошибка соединения. Попробуйте позже.", "bot");
    }
  }

  // Автоматическое увеличение высоты textarea
  input.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
  });

  // Отправка по Enter (без Shift)
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Очистка аудио при перезагрузке/закрытии
  window.addEventListener('beforeunload', () => {
    audioPlayers.forEach(player => {
      if (player.audio) {
        player.audio.pause();
        player.audio.src = '';
      }
    });
  });
</script>

</body>
</html>
